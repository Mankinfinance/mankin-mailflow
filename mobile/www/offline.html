<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c2566">
<title>Mailflow</title>
<!--
  Shown by the Android app (MailflowWebViewClient) when the live site
  can't be reached, and by Capacitor itself if the phone's WebView is too
  old. Everything is inline: this page is often shown with no network
  and no base address, so a linked image or stylesheet would not load.
  The app swaps the null below for what went wrong.
-->
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #f7f4ee; color: #22253a; font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; padding: 32px 24px; text-align: center; }
  svg { width: 64px; height: 64px; border-radius: 14px; display: block; margin: 0 auto; }
  h1 { font: 500 22px/1.25 Georgia, "Times New Roman", serif; color: #0c034b; margin: 18px 0 8px; }
  p { margin: 0 0 20px; color: #5f636e; }
  button { font: 600 14px system-ui, sans-serif; color: #fff; background: #161461; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  #detail { margin: 24px 0 0; font: 12px/1.5 ui-monospace, Menlo, monospace; color: #8a8d96; word-break: break-all; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mailflow">
    <rect width="512" height="512" fill="#1c2566"/>
    <g transform="translate(70 22) scale(6)">
      <rect x="6" y="18" width="46" height="6" rx="3" fill="#f0c26a"/>
      <rect x="6" y="29" width="34" height="6" rx="3" fill="#ffffff"/>
      <rect x="6" y="40" width="22" height="6" rx="3" fill="#ffffff"/>
      <path d="M 8 52 Q 32 60 56 46" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" fill="none" opacity="0.5"/>
    </g>
  </svg>
  <h1 id="title">Mailflow couldn't load</h1>
  <p id="message">Check your Wi-Fi or mobile data, then try again. If this phone is online, update Android System WebView from the Play Store.</p>
  <button type="button" onclick="location.href='https://mankin-mailflow.vercel.app/marketing'">Try again</button>
  <p id="detail" hidden></p>
</main>
<script>
  var failure = /*MAILFLOW_ERROR*/null;
  if (failure) {
    if (failure.offline) {
      document.getElementById("title").textContent = "You're offline";
      document.getElementById("message").textContent =
        "Mailflow needs a connection to show your campaigns and contacts. Check your Wi-Fi or mobile data, then try again.";
    } else {
      document.getElementById("message").textContent =
        "The phone is online but the page didn't load. Try again, and if it keeps happening, send a screenshot of this screen.";
    }
    var detail = document.getElementById("detail");
    detail.textContent = failure.code + " " + failure.description + " · " + failure.url;
    detail.hidden = false;
  }
</script>
</body>
</html>
