# Builds the Mailflow Android app (mobile/) whenever the app shell
# changes, or on demand from the Actions tab ("Run workflow").
#
# Output:
#   A GitHub Release, "Mailflow for Android 1.0.<run>", with the .apk
#   attached - open the repository's Releases page on an Android phone
#   and tap the .apk to install. The newest is always .../releases/latest.
#   Also under the run's Artifacts:
#   mailflow-android-apk  - the same app
#   mailflow-android-aab  - the bundle Google Play takes (signed builds only)
#
# Signed builds need four repository secrets (Settings > Secrets and
# variables > Actions): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
# ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. Without them it makes a debug
# build, which installs and runs the same but must be uninstalled before
# a later debug build will install over it.
name: Mobile - Android

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

permissions:
  # write: to publish each build as a GitHub Release.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    env:
      MAILFLOW_VERSION_CODE: ${{ github.run_number }}
      MAILFLOW_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install
        run: npm ci

      - name: Copy the app config into the Android project
        run: npx cap sync android

      - name: Decide signed or debug
        id: mode
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"; else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build (signed release)
        if: steps.mode.outputs.signed == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MAILFLOW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MAILFLOW_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MAILFLOW_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/mailflow.keystore"
          export MAILFLOW_KEYSTORE_PATH="$RUNNER_TEMP/mailflow.keystore"
          cd android && ./gradlew --no-daemon assembleRelease bundleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/Mailflow-${MAILFLOW_VERSION_NAME}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "../dist/Mailflow-${MAILFLOW_VERSION_NAME}.aab"

      - name: Build (debug)
        if: steps.mode.outputs.signed != 'true'
        run: |
          cd android && ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk "../dist/Mailflow-${MAILFLOW_VERSION_NAME}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mailflow-android-apk
          path: mobile/dist/*.apk
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: steps.mode.outputs.signed == 'true'
        with:
          name: mailflow-android-aab
          path: mobile/dist/*.aab
          retention-days: 90

      - name: Publish as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.mode.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then KIND="signed"; else KIND="test build"; fi
          NOTES="Mailflow for Android, $KIND, from ${GITHUB_SHA::7}.

          Install: open the .apk below on an Android phone. If Android asks, allow your browser to install unknown apps."
          if [ "$SIGNED" != "true" ]; then
            NOTES="$NOTES

          This is a test build: uninstall the previous Mailflow first, then install this one."
          fi
          gh release create "android-v${MAILFLOW_VERSION_NAME}" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Mailflow for Android ${MAILFLOW_VERSION_NAME}" \
            --notes "$NOTES" \
            --latest
