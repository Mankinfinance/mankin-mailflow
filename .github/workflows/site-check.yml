# Looks at Mailflow's addresses from outside: what DNS says, and what
# each one answers. Runs when this file changes, or on demand from the
# Actions tab ("Run workflow"). Changes nothing; it only reads.
name: Site check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS, asked of the domain's own name servers
        run: |
          # Public resolvers remember "doesn't exist" for a while; the
          # domain's own name servers have the record the moment it's saved.
          NS=$(dig +short NS mankinfinance.com @1.1.1.1 | head -1)
          echo "Name servers: $(dig +short NS mankinfinance.com @1.1.1.1 | tr '\n' ' ')"
          echo "SOA (last number = how long 'doesn't exist' is remembered, in seconds): $(dig +short SOA mankinfinance.com @1.1.1.1)"
          for name in mail.mankinfinance.com mail.mankinfinance.com.mankinfinance.com mail.mankinfinance.com.au; do
            echo "== $name (at $NS)"
            dig +noall +answer +authority "$name" ANY @"$NS" | sed 's/^/   /' || true
            echo "   CNAME: $(dig +short CNAME "$name" @"$NS" | tr '\n' ' ')  A: $(dig +short A "$name" @"$NS" | tr '\n' ' ')"
          done
          echo "Google public DNS: $(dig +short mail.mankinfinance.com @8.8.8.8 | tr '\n' ' ')"
          echo "== Other records at every name server (are they in step?)"
          for ns in $(dig +short NS mankinfinance.com @1.1.1.1); do
            echo "-- $ns"
            echo "   mail CNAME:       $(dig +short CNAME mail.mankinfinance.com @"$ns" | tr '\n' ' ')"
            echo "   selector1 CNAME:  $(dig +short CNAME selector1._domainkey.mankinfinance.com @"$ns" | tr '\n' ' ')"
            echo "   autodiscover:     $(dig +short CNAME autodiscover.mankinfinance.com @"$ns" | tr '\n' ' ')"
            echo "   litesrv:          $(dig +short CNAME litesrv._domainkey.mankinfinance.com @"$ns" | tr '\n' ' ')"
            echo "   _dmarc TXT:       $(dig +short TXT _dmarc.mankinfinance.com @"$ns" | tr '\n' ' ')"
            echo "   www:              $(dig +short www.mankinfinance.com @"$ns" | tr '\n' ' ')"
          done

      - name: DNS, as the public sees it
        run: |
          for name in mail.mankinfinance.com mankin-mailflow.vercel.app; do
            echo "== $name"
            echo "CNAME: $(dig +short CNAME "$name" @1.1.1.1 | tr '\n' ' ')"
            echo "A:     $(dig +short A "$name" @1.1.1.1 | tr '\n' ' ')"
          done

      - name: What each address answers
        run: |
          for url in https://mail.mankinfinance.com/api/health https://mankin-mailflow.vercel.app/api/health; do
            echo "== $url"
            curl -sS -o /dev/null --max-time 20 \
              -w "status %{http_code}, TLS verify %{ssl_verify_result}, ip %{remote_ip}, %{time_total}s\n" \
              "$url" || echo "(no answer)"
            curl -sS -I --max-time 20 "$url" 2>&1 | grep -iE '^(HTTP|server|x-vercel|location)' || true
            echo | openssl s_client -connect "$(echo "$url" | cut -d/ -f3):443" -servername "$(echo "$url" | cut -d/ -f3)" 2>/dev/null \
              | openssl x509 -noout -subject -issuer -enddate 2>/dev/null || echo "(no certificate)"
          done

      - name: Is the mail record being served?
        run: |
          NS=$(dig +short NS mankinfinance.com @1.1.1.1 | head -1)
          got=$(dig +short CNAME mail.mankinfinance.com @"$NS")
          if [ -z "$got" ]; then
            echo "::error::$NS has no CNAME for mail.mankinfinance.com"
            exit 1
          fi
          echo "mail.mankinfinance.com -> $got"

      - name: Security checks against the live site
        if: always()
        run: |
          B=https://mankin-mailflow.vercel.app
          fail=0
          check() { if [ "$2" = "$3" ]; then echo "ok   $1 ($2)"; else echo "::error::$1: got $2, expected $3"; fail=1; fi; }

          # Signed out, every app page goes to sign-in - including paths
          # ending .png/.svg, which used to skip the sign-in check.
          for p in /marketing /marketing/campaigns/x.png /marketing/forms/x.svg /marketing/settings; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$B$p")
            loc=$(curl -s -o /dev/null -w "%{redirect_url}" "$B$p")
            check "signed out $p" "$code $(echo "$loc" | grep -o '/login' | head -1)" "307 /login"
          done

          # A server action POSTed to a .png path without a session must not run.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Next-Action: 0000000000000000000000000000000000000000" "$B/marketing/campaigns/x.png")
          check "server action on .png path, signed out" "$code" "307"

          # No one else may frame the app; public forms may be embedded.
          xfo=$(curl -s -I "$B/login" | tr -d '\r' | grep -i '^x-frame-options:' | cut -d' ' -f2)
          check "X-Frame-Options on /login" "$xfo" "SAMEORIGIN"

          # The session endpoint never carries Microsoft tokens.
          if curl -s "$B/api/auth/session" | grep -qi "msAccessToken\|msRefreshToken"; then echo "::error::session JSON carries Microsoft tokens"; fail=1; else echo "ok   session JSON has no Microsoft tokens"; fi

          # A click link with a forged destination does not go there.
          loc=$(curl -s -o /dev/null -w "%{redirect_url}" "$B/e/c/not-a-real-token?u=https%3A%2F%2Fevil.example%2F")
          case "$loc" in *evil.example*) echo "::error::click link redirected to an unsigned destination"; fail=1;; *) echo "ok   forged click link -> ${loc:-none}";; esac

          # Admin-only API routes refuse a signed-out caller.
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$B/api/admin/migrate")
          case "$code" in 307|401|403) echo "ok   /api/admin/migrate signed out ($code)";; *) echo "::error::/api/admin/migrate signed out returned $code"; fail=1;; esac

          exit $fail
